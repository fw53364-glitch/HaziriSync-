<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HaziriSync - Staff Attendance</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function HaziriSync() {
      const [view, setView] = useState("boss");
      const [staffList, setStaffList] = useState([
        { id: "EMP-001", name: "Farhan Wahid", role: "Owner / Director", isOwner: true, phone: "9876543210", status: "Present", inTime: "09:56 AM" },
        { id: "EMP-002", name: "Rahul Sharma", role: "Counter Sales", isOwner: false, phone: "9811223344", status: "Present", inTime: "10:02 AM" },
        { id: "EMP-003", name: "Mohit Verma", role: "Inventory Head", isOwner: false, phone: "9899887766", status: "Absent", inTime: "--" },
        { id: "EMP-004", name: "Sameer Khan", role: "Delivery & Logistics", isOwner: false, phone: "9871122334", status: "Absent", inTime: "--" },
        { id: "EMP-005", name: "Vikas Kumar", role: "Billing Specialist", isOwner: false, phone: "9810101010", status: "Absent", inTime: "--" }
      ]);

      const [activeStaffId, setActiveStaffId] = useState("EMP-001");
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const playChime = (type) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type === "open" ? "sine" : "triangle";
          osc.frequency.setValueAtTime(type === "open" ? 784 : 440, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1);
        } catch(e) {}
      };

      const handlePunch = (status) => {
        const timeStr = currentTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        setStaffList(prev => prev.map(s => s.id === activeStaffId ? { ...s, status: status === 'in' ? 'Present' : s.status, inTime: status === 'in' ? timeStr : s.inTime } : s));
      };

      const presentStaff = staffList.filter(s => s.status === "Present");
      const absentStaff = staffList.filter(s => s.status !== "Present");

      return (
        <div className="max-w-md mx-auto p-4 space-y-4">
          {/* Header */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <h1 className="text-xl font-black text-white flex items-center gap-2">
                <span className="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-sm border border-orange-500/40">ह</span>
                HaziriSync
              </h1>
              <span className="text-[11px] text-orange-400 font-bold">Shift: 10 AM - 8 PM</span>
            </div>
            <button 
              onClick={() => setView(view === 'boss' ? 'staff' : 'boss')}
              className="bg-orange-500 text-black font-bold text-xs px-3 py-1.5 rounded-xl shadow">
              {view === 'boss' ? 'Owner Mode' : 'Staff Mode'}
            </button>
          </div>

          {/* Alarm Quick Test */}
          <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-xs space-y-2">
            <div className="flex justify-between items-center text-slate-400">
              <span>Shift Alarm Engine (10:00 AM - 08:00 PM)</span>
              <span className="text-orange-400 font-bold">Live</span>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => playChime('open')} className="bg-slate-800 p-2 rounded-lg text-[11px] text-slate-300 border border-slate-700">
                🔔 Test 10 AM Alarm
              </button>
              <button onClick={() => playChime('close')} className="bg-slate-800 p-2 rounded-lg text-[11px] text-slate-300 border border-slate-700">
                🚪 Test 8 PM Alarm
              </button>
            </div>
          </div>

          {view === 'boss' ? (
            <div className="space-y-4">
              {/* Counters */}
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                  <span className="text-xs text-slate-400">TOTAL STAFF</span>
                  <p className="text-2xl font-black text-white mt-1">{staffList.length}</p>
                  <span className="text-[10px] text-slate-500">Registered Members</span>
                </div>
                <div className="bg-slate-900 border border-emerald-500/30 p-3.5 rounded-2xl">
                  <span className="text-xs text-emerald-400">PRESENT TODAY</span>
                  <p className="text-2xl font-black text-emerald-400 mt-1">{presentStaff.length}</p>
                  <span className="text-[10px] text-slate-500">Office Par Aaye Log</span>
                </div>
              </div>

              {/* Present List */}
              <div className="bg-slate-900 border border-emerald-500/20 rounded-2xl p-4">
                <h3 className="text-sm font-bold text-white mb-3 flex items-center justify-between">
                  <span>🟢 Present Staff ({presentStaff.length})</span>
                  <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded">उपस्थित</span>
                </h3>
                <div className="space-y-2">
                  {presentStaff.map(s => (
                    <div key={s.id} className="bg-slate-950 p-2.5 rounded-xl flex items-center justify-between border border-slate-800">
                      <div>
                        <div className="font-bold text-xs text-white flex items-center gap-1.5">
                          {s.name} {s.isOwner && <span className="text-[9px] bg-orange-500 text-black px-1 rounded font-bold">Owner</span>}
                        </div>
                        <span className="text-[10px] text-slate-400">{s.role}</span>
                      </div>
                      <span className="text-xs font-mono text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-900">
                        {s.inTime}
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Absent List */}
              <div className="bg-slate-900 border border-rose-500/20 rounded-2xl p-4">
                <h3 className="text-sm font-bold text-white mb-3 flex items-center justify-between">
                  <span>🔴 Absent / Baaki ({absentStaff.length})</span>
                  <span className="text-[10px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded">अनुपस्थित</span>
                </h3>
                <div className="space-y-2">
                  {absentStaff.map(s => (
                    <div key={s.id} className="bg-slate-950 p-2.5 rounded-xl flex items-center justify-between border border-slate-800">
                      <div>
                        <div className="font-bold text-xs text-white">{s.name}</div>
                        <span className="text-[10px] text-slate-400">{s.role}</span>
                      </div>
                      <button 
                        onClick={() => {
                          const timeNow = currentTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                          setStaffList(prev => prev.map(item => item.id === s.id ? { ...item, status: "Present", inTime: timeNow } : item));
                        }}
                        className="text-[11px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-lg border border-emerald-500/30">
                        + Mark Present
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : (
            /* Staff Punch View */
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-5">
              <div>
                <label className="text-xs text-slate-400 block mb-1">Apna Naam Chuniye:</label>
                <select 
                  value={activeStaffId} 
                  onChange={(e) => setActiveStaffId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl p-2.5 text-xs font-bold">
                  {staffList.map(s => <option key={s.id} value={s.id}>{s.name} ({s.role})</option>)}
                </select>
              </div>

              <div className="py-4 bg-slate-950 rounded-2xl border border-slate-800">
                <span className="text-[11px] text-slate-500 uppercase tracking-widest font-bold">Live IST Clock</span>
                <div className="text-3xl font-black font-mono text-white mt-1">
                  {currentTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                </div>
              </div>

              <button 
                onClick={() => handlePunch('in')}
                className="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-black font-black text-base py-4 rounded-2xl shadow-xl transition">
                PUNCH IN (हाज़िरी लगाएं)
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<HaziriSync />);
  </script>
</body>
</html>
