<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HaziriSync - Staff & Owner Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function HaziriSync() {
      // LocalStorage se data load karna (Zero dummy data)
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem("haziri_users");
        return saved ? JSON.parse(saved) : [];
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("haziri_session");
        return saved ? JSON.parse(saved) : null;
      });

      // Login/Registration Form States
      const [phoneInput, setPhoneInput] = useState("");
      const [isNewUserStep, setIsNewUserStep] = useState(false);
      const [registerForm, setRegisterForm] = useState({ name: "", role: "", isOwner: false });

      // Owner Manual Modal
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [editForm, setEditForm] = useState({ name: "", role: "", phone: "" });

      const [currentTime, setCurrentTime] = useState(new Date());

      // Save to LocalStorage on update
      useEffect(() => {
        localStorage.setItem("haziri_users", JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem("haziri_session", JSON.stringify(currentUser));
        } else {
          localStorage.removeItem("haziri_session");
        }
      }, [currentUser]);

      // Clock Timer
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Audio Alarm Generator
      const playAlarm = (type) => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type === "open" ? "sine" : "triangle";
          osc.frequency.setValueAtTime(type === "open" ? 784 : 440, ctx.currentTime);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1.2);
        } catch(e) {}
      };

      // 1. PHONE LOGIN / CHECK
      const handlePhoneSubmit = (e) => {
        e.preventDefault();
        const cleanPhone = phoneInput.trim();
        if (cleanPhone.length < 10) {
          alert("Kripya sahi 10-digit mobile number daalein!");
          return;
        }

        const existing = users.find(u => u.phone === cleanPhone);
        if (existing) {
          // Purana user mil gaya -> Direct Login
          setCurrentUser(existing);
        } else {
          // Naya user hai -> Registration form dikhao
          const hasOwnerAlready = users.some(u => u.isOwner);
          setRegisterForm({
            name: "",
            role: hasOwnerAlready ? "" : "Company Owner / Boss",
            isOwner: !hasOwnerAlready
          });
          setIsNewUserStep(true);
        }
      };

      // 2. SELF-REGISTRATION
      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        if (!registerForm.name.trim() || !registerForm.role.trim()) {
          alert("Naam aur Role dono likhna zaroori hai!");
          return;
        }

        const newUser = {
          id: `USR-${Date.now().toString().slice(-4)}`,
          phone: phoneInput.trim(),
          name: registerForm.name.trim(),
          role: registerForm.role.trim(),
          isOwner: registerForm.isOwner,
          status: "Absent",
          inTime: "--",
          outTime: "--"
        };

        const updatedList = [...users, newUser];
        setUsers(updatedList);
        setCurrentUser(newUser);
        setIsNewUserStep(false);
        setPhoneInput("");
      };

      // 3. PUNCH IN / OUT (Staff & Owner)
      const handlePunch = (statusType) => {
        const timeStr = currentTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const updated = users.map(u => {
          if (u.id === currentUser.id) {
            return {
              ...u,
              status: statusType === "in" ? "Present" : u.status,
              inTime: statusType === "in" ? timeStr : u.inTime,
              outTime: statusType === "out" ? timeStr : u.outTime
            };
          }
          return u;
        });

        setUsers(updated);
        setCurrentUser(prev => ({
          ...prev,
          status: statusType === "in" ? "Present" : prev.status,
          inTime: statusType === "in" ? timeStr : prev.inTime,
          outTime: statusType === "out" ? timeStr : prev.outTime
        }));
      };

      // 4. OWNER: EDIT ANY USER (Name, Role, Phone)
      const handleSaveEdit = (e) => {
        e.preventDefault();
        const updated = users.map(u => {
          if (u.id === editingUser.id) {
            return {
              ...u,
              name: editForm.name.trim(),
              role: editForm.role.trim(),
              phone: editForm.phone.trim()
            };
          }
          return u;
        });

        setUsers(updated);
        // Agar owner ne khud ka profile edit kiya
        if (currentUser.id === editingUser.id) {
          setCurrentUser(prev => ({
            ...prev,
            name: editForm.name.trim(),
            role: editForm.role.trim(),
            phone: editForm.phone.trim()
          }));
        }
        setIsModalOpen(false);
        setEditingUser(null);
      };

      // 5. OWNER: DELETE USER
      const handleDeleteUser = (userId, userName) => {
        if (confirm(`Kya aap sach me "${userName}" ko system se delete karna chahte hain?`)) {
          setUsers(users.filter(u => u.id !== userId));
        }
      };

      // 6. OWNER: QUICK MARK PRESENT
      const quickMarkPresent = (userId) => {
        const timeStr = currentTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        setUsers(users.map(u => u.id === userId ? { ...u, status: "Present", inTime: timeStr } : u));
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIsNewUserStep(false);
        setPhoneInput("");
      };

      // ================== SCREEN 1: LOGIN / NUMBER REGISTRATION ==================
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-orange-500/20 text-orange-400 border border-orange-500/40 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black">
                  ह
                </div>
                <h1 className="text-2xl font-black text-white">HaziriSync</h1>
                <p className="text-xs text-slate-400">Apna Mobile Number daal kar continue karein</p>
              </div>

              {!isNewUserStep ? (
                <form onSubmit={handlePhoneSubmit} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-300 font-semibold block mb-1.5">Mobile Number:</label>
                    <input
                      type="tel"
                      required
                      maxLength="10"
                      placeholder="10-digit number (e.g. 9876543210)"
                      value={phoneInput}
                      onChange={(e) => setPhoneInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-base font-mono tracking-wider focus:outline-none focus:border-orange-500"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-orange-500 hover:bg-orange-400 text-black font-bold py-3.5 rounded-xl text-sm transition shadow-lg"
                  >
                    Next / Login Karein →
                  </button>
                  <p className="text-[11px] text-slate-500 text-center">
                    Agar aapka number pehle se juda hai to direct login hoga, naye number par registration khulega.
                  </p>
                </form>
              ) : (
                <form onSubmit={handleRegisterSubmit} className="space-y-4">
                  <div className="bg-orange-500/10 border border-orange-500/30 rounded-xl p-3 text-xs text-orange-300">
                    Naya number darj hua: <strong className="font-mono text-white">{phoneInput}</strong>
                    {registerForm.isOwner && <span className="block mt-1 text-[11px] text-orange-400">👑 Aap is company ke pehle user hain, isliye aap <strong>Owner</strong> banenge.</span>}
                  </div>

                  <div>
                    <label className="text-xs text-slate-300 font-semibold block mb-1">Aapka Pura Naam:</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Farhan Wahid ya Rahul"
                      value={registerForm.name}
                      onChange={(e) => setRegisterForm({ ...registerForm, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-300 font-semibold block mb-1">Aapka Role / Kaam (Custom Role):</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Owner, Counter Sales, Driver, Inventory Manager"
                      value={registerForm.role}
                      onChange={(e) => setRegisterForm({ ...registerForm, role: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500"
                    />
                    <span className="text-[10px] text-slate-500">Aap jo chahein wo designation likh sakte hain.</span>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsNewUserStep(false)}
                      className="flex-1 bg-slate-800 text-slate-400 py-3 rounded-xl text-xs font-bold"
                    >
                      Peeche Jayein
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl text-xs shadow-lg transition"
                    >
                      Register & Kholein
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        );
      }

      // ================== SCREEN 2: MAIN DASHBOARD ==================
      const presentStaff = users.filter(u => u.status === "Present");
      const absentStaff = users.filter(u => u.status !== "Present");

      return (
        <div className="max-w-md mx-auto p-4 space-y-4 pb-12">

          {/* TOP BAR */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg font-black text-white flex items-center gap-1.5">
                  <span className="w-7 h-7 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-xs border border-orange-500/40">ह</span>
                  HaziriSync
                </h1>
                {currentUser.isOwner ? (
                  <span className="text-[10px] bg-orange-500 text-black font-black px-2 py-0.5 rounded">OWNER MODE</span>
                ) : (
                  <span className="text-[10px] bg-blue-500/20 text-blue-300 font-bold px-2 py-0.5 rounded border border-blue-500/30">STAFF</span>
                )}
              </div>
              <p className="text-[11px] text-slate-400 mt-0.5">
                Logged in: <strong className="text-white">{currentUser.name}</strong> ({currentUser.role})
              </p>
            </div>

            <button
              onClick={handleLogout}
              className="text-[11px] bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-700 transition"
            >
              Logout
            </button>
          </div>

          {/* ALARM BAR */}
          <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-xs space-y-2">
            <div className="flex justify-between items-center text-slate-400">
              <span>Shift Timing: 10:00 AM - 08:00 PM</span>
              <span className="text-orange-400 font-bold">Alarm Ready</span>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => playAlarm("open")} className="bg-slate-800 p-2 rounded-lg text-[11px] text-slate-300 border border-slate-700">
                🔔 Test 10 AM Alarm
              </button>
              <button onClick={() => playAlarm("close")} className="bg-slate-800 p-2 rounded-lg text-[11px] text-slate-300 border border-slate-700">
                🚪 Test 8 PM Alarm
              </button>
            </div>
          </div>

          {/* DIGITAL LIVE CLOCK & PUNCH BUTTON (SABHI KE LIYE) */}
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
            <div className="py-3 bg-slate-950 rounded-2xl border border-slate-800">
              <span className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Live IST Clock</span>
              <div className="text-3xl font-black font-mono text-white mt-0.5">
                {currentTime.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
              </div>
            </div>

            {currentUser.status !== "Present" ? (
              <button
                onClick={() => handlePunch("in")}
                className="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-black font-black text-base py-4 rounded-2xl shadow-lg transition"
              >
                PUNCH IN (हाज़िरी लगाएं)
              </button>
            ) : (
              <button
                onClick={() => handlePunch("out")}
                className="w-full bg-rose-500 hover:bg-rose-400 active:scale-95 text-black font-black text-base py-4 rounded-2xl shadow-lg transition"
              >
                PUNCH OUT (ड्यूटी खत्म)
              </button>
            )}

            <div className="flex justify-between text-xs text-slate-400 bg-slate-950 px-4 py-2.5 rounded-xl border border-slate-800/80">
              <span>Punch-In: <strong className="text-white">{currentUser.inTime}</strong></span>
              <span>Punch-Out: <strong className="text-white">{currentUser.outTime}</strong></span>
              <span>Status: <strong className={currentUser.status === "Present" ? "text-emerald-400" : "text-rose-400"}>{currentUser.status}</strong></span>
            </div>
          </div>

          {/* ================== OWNER EXCLUSIVE SECTION ================== */}
          {currentUser.isOwner && (
            <div className="space-y-4 pt-2">
              <div className="flex items-center justify-between">
                <h2 className="text-sm font-bold text-white uppercase tracking-wider">Owner Control Desk</h2>
                <span className="text-[11px] text-slate-400">Total Registered: {users.length}</span>
              </div>

              {/* STATS */}
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-900 border border-emerald-500/30 p-3.5 rounded-2xl">
                  <span className="text-xs text-emerald-400 font-semibold">PRESENT TODAY</span>
                  <p className="text-2xl font-black text-emerald-400 mt-1">{presentStaff.length}</p>
                </div>
                <div className="bg-slate-900 border border-rose-500/30 p-3.5 rounded-2xl">
                  <span className="text-xs text-rose-400 font-semibold">ABSENT / BAAKI</span>
                  <p className="text-2xl font-black text-rose-400 mt-1">{absentStaff.length}</p>
                </div>
              </div>

              {/* PRESENT STAFF LIST */}
              <div className="bg-slate-900 border border-emerald-500/30 rounded-2xl p-4">
                <h3 className="text-xs font-bold text-white mb-2 flex justify-between items-center">
                  <span>🟢 Present Staff ({presentStaff.length})</span>
                  <span className="text-[10px] text-emerald-400">Office me hain</span>
                </h3>
                {presentStaff.length === 0 ? (
                  <p className="text-xs text-slate-500 py-3 text-center">Abhi tak kisi ne punch nahi kiya.</p>
                ) : (
                  <div className="space-y-2">
                    {presentStaff.map(u => (
                      <div key={u.id} className="bg-slate-950 p-2.5 rounded-xl flex items-center justify-between border border-slate-800 text-xs">
                        <div>
                          <div className="font-bold text-white flex items-center gap-1.5">
                            {u.name} {u.isOwner && <span className="text-[9px] bg-orange-500 text-black px-1 rounded font-bold">Owner</span>}
                          </div>
                          <span className="text-[10px] text-emerald-300 font-medium">{u.role}</span>
                        </div>
                        <span className="font-mono text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800">
                          {u.inTime}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* ABSENT STAFF LIST */}
              <div className="bg-slate-900 border border-rose-500/30 rounded-2xl p-4">
                <h3 className="text-xs font-bold text-white mb-2 flex justify-between items-center">
                  <span>🔴 Absent / Haazri Baaki ({absentStaff.length})</span>
                  <span className="text-[10px] text-rose-400">Nahi Aaye</span>
                </h3>
                {absentStaff.length === 0 ? (
                  <p className="text-xs text-emerald-400 py-3 text-center">🎉 Sabhi staff members present hain!</p>
                ) : (
                  <div className="space-y-2">
                    {absentStaff.map(u => (
                      <div key={u.id} className="bg-slate-950 p-2.5 rounded-xl flex items-center justify-between border border-slate-800 text-xs">
                        <div>
