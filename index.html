<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HaziriSync - Staff Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col justify-center">

  <div id="app" class="max-w-md w-full mx-auto space-y-4"></div>

  <script>
    function getUsers() {
      return JSON.parse(localStorage.getItem('haziri_users') || '[]');
    }
    function saveUsers(users) {
      localStorage.setItem('haziri_users', JSON.stringify(users));
    }
    function getSession() {
      return JSON.parse(localStorage.getItem('haziri_session') || 'null');
    }
    function saveSession(user) {
      if(user) localStorage.setItem('haziri_session', JSON.stringify(user));
      else localStorage.removeItem('haziri_session');
    }

    function playAlarm(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type === 'open' ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(type === 'open' ? 784 : 440, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch(e) {}
    }

    function render() {
      const app = document.getElementById('app');
      const currentUser = getSession();
      const users = getUsers();

      // SCREEN 1: LOGIN
      if (!currentUser) {
        app.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
            <div class="text-center space-y-2">
              <div class="w-14 h-14 bg-orange-500/20 text-orange-400 border border-orange-500/40 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black">
                ह
              </div>
              <h1 class="text-2xl font-black text-white">HaziriSync</h1>
              <p class="text-xs text-slate-400">Apna 10-Digit Mobile Number Daalein</p>
            </div>

            <form id="phoneForm" class="space-y-4">
              <div>
                <label class="text-xs text-slate-300 font-semibold block mb-1">Mobile Number:</label>
                <input type="tel" id="mobileInput" required maxlength="10" placeholder="e.g. 9876543210"
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-base font-mono tracking-wider focus:outline-none focus:border-orange-500">
              </div>
              <button type="submit" class="w-full bg-orange-500 hover:bg-orange-400 text-black font-bold py-3.5 rounded-xl text-sm transition shadow-lg">
                Login / Aage Badhein →
              </button>
            </form>

            <div id="regBox" class="hidden space-y-3 pt-3 border-t border-slate-800">
              <div class="bg-orange-500/10 border border-orange-500/30 rounded-xl p-3 text-xs text-orange-300" id="regAlert"></div>
              <div>
                <label class="text-xs text-slate-300 block mb-1">Aapka Pura Naam:</label>
                <input type="text" id="regName" placeholder="e.g. Farhan Wahid"
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
              </div>
              <div>
                <label class="text-xs text-slate-300 block mb-1">Aapka Role (Custom Role):</label>
                <input type="text" id="regRole" placeholder="e.g. Owner, Counter Sales, Manager"
                  class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
              </div>
              <button id="btnCompleteReg" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl text-xs shadow-lg">
                Register & App Kholein
              </button>
            </div>
          </div>
        `;

        document.getElementById('phoneForm').onsubmit = function(e) {
          e.preventDefault();
          const phone = document.getElementById('mobileInput').value.trim();
          if (phone.length < 10) return alert('Kripya 10-digit number likhein!');
          
          const existing = users.find(u => u.phone === phone);
          if (existing) {
            saveSession(existing);
            render();
          } else {
            document.getElementById('phoneForm').classList.add('hidden');
            const regBox = document.getElementById('regBox');
            regBox.classList.remove('hidden');
            const isFirst = users.length === 0;
            document.getElementById('regAlert').innerHTML = `Naya number: <strong>${phone}</strong>${isFirst ? '<br>👑 Pehla user hone ke naate aap <strong>Owner</strong> banenge.' : ''}`;
            if (isFirst) document.getElementById('regRole').value = 'Owner / Director';
            
            document.getElementById('btnCompleteReg').onclick = function() {
              const name = document.getElementById('regName').value.trim();
              const role = document.getElementById('regRole').value.trim();
              if (!name || !role) return alert('Naam aur Role dono likhein!');
              const newUser = {
                id: 'USR-' + Date.now().toString().slice(-4),
                phone, name, role, isOwner: isFirst,
                status: 'Absent', inTime: '--', outTime: '--'
              };
              users.push(newUser);
              saveUsers(users);
              saveSession(newUser);
              render();
            };
          }
        };
        return;
      }

      // SCREEN 2: MAIN DASHBOARD
      const presentStaff = users.filter(u => u.status === 'Present');
      const absentStaff = users.filter(u => u.status !== 'Present');
      const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      app.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
          <div>
            <div class="flex items-center gap-2">
              <span class="w-7 h-7 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-xs border border-orange-500/40">ह</span>
              <h1 class="text-lg font-black text-white">HaziriSync</h1>
              ${currentUser.isOwner ? '<span class="text-[10px] bg-orange-500 text-black font-black px-2 py-0.5 rounded">OWNER</span>' : '<span class="text-[10px] bg-blue-500/20 text-blue-300 font-bold px-2 py-0.5 rounded">STAFF</span>'}
            </div>
            <p class="text-[11px] text-slate-400 mt-1">Logged in: <strong class="text-white">${currentUser.name}</strong> (${currentUser.role})</p>
          </div>
          <button id="btnLogout" class="text-xs bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-700">Logout</button>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-xs space-y-2">
          <div class="flex justify-between items-center text-slate-400">
            <span>Shift: 10:00 AM - 08:00 PM</span>
            <span class="text-orange-400 font-bold">Alarm Ready</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="playAlarm('open')" class="bg-slate-800 p-2 rounded-lg text-slate-300 border border-slate-700 text-center">🔔 Test 10 AM Alarm</button>
            <button onclick="playAlarm('close')" class="bg-slate-800 p-2 rounded-lg text-slate-300 border border-slate-700 text-center">🚪 Test 8 PM Alarm</button>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 text-center space-y-4 shadow-xl">
          <div class="py-3 bg-slate-950 rounded-2xl border border-slate-800">
            <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Live IST Clock</span>
            <div id="clockDisplay" class="text-3xl font-black font-mono text-white mt-1">${nowStr}</div>
          </div>

          ${currentUser.status !== 'Present' ? `
            <button id="btnPunchIn" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-black font-black text-base py-4 rounded-2xl shadow-lg transition">
              PUNCH IN (हाज़िरी लगाएं)
            </button>
          ` : `
            <button id="btnPunchOut" class="w-full bg-rose-500 hover:bg-rose-400 active:scale-95 text-black font-black text-base py-4 rounded-2xl shadow-lg transition">
              PUNCH OUT (ड्यूटी खत्म)
            </button>
          `}

          <div class="flex justify-between text-xs text-slate-400 bg-slate-950 px-4 py-2.5 rounded-xl border border-slate-800">
            <span>Punch-In: <strong class="text-white">${currentUser.inTime}</strong></span>
            <span>Status: <strong class="${currentUser.status === 'Present' ? 'text-emerald-400' : 'text-rose-400'}">${currentUser.status}</strong></span>
          </div>
        </div>

        ${currentUser.isOwner ? `
          <div class="space-y-4 pt-2">
            <div class="flex justify-between items-center">
              <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Owner Control Panel</h2>
              <span class="text-xs text-slate-400">Total Staff: ${users.length}</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="bg-slate-900 border border-emerald-500/30 p-3.5 rounded-2xl">
                <span class="text-xs text-emerald-400 font-semibold">PRESENT TODAY</span>
                <p class="text-2xl font-black text-emerald-400 mt-1">${presentStaff.length}</p>
              </div>
              <div class="bg-slate-900 border border-rose-500/30 p-3.5 rounded-2xl">
                <span class="text-xs text-rose-400 font-semibold">ABSENT / BAAKI</span>
                <p class="text-2xl font-black text-rose-400 mt-1">${absentStaff.length}</p>
              </div>
            </div>

            <div class="bg-slate-900 border border-emerald-500/30 rounded-2xl p-4">
              <h3 class="text-xs font-bold text-white mb-2 flex justify-between">
                <span>🟢 Present Staff (${presentStaff.length})</span>
                <span class="text-emerald-400 text-[10px]">Office Me Hain</span>
              </h3>
              <div class="space-y-2">
                ${presentStaff.length === 0 ? '<p class="text-xs text-slate-500 py-2 text-center">Kisi ne punch nahi kiya</p>' : 
                  presentStaff.map(u => `
                    <div class="bg-slate-950 p-2.5 rounded-xl flex items-center justify-between border border-slate-800 text-xs">
                      <div>
                        <div class="font-bold text-white">${u.name} ${u.isOwner ? '<span class="text-[9px] bg-orange-500 text-black px-1 rounded">Owner</span>' : ''}</div>
                        <span class="text-[10px] text-emerald-300">${u.role}</span>
                      </div>
                      <span class="font-mono text-emerald-400 font-bold bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">${u.inTime}</span>
                    </div>
                  `).join('')
                }
              </div>
            </div>

            <div class="bg-slate-900 border border-rose-500/30 rounded-2xl p-4">
              <h3 class="text-xs font-bold text-white mb-2 flex justify-between">
                <span>🔴 Absent Staff (${absentStaff.length})</span>
                <span class="text-rose-400 text-[10px]">Nahi Aaye</span>
              </h3>
              <div class="space-y-2">
                ${absentStaff.length === 0 ? '<p class="text-xs text-emerald-400 py-2 text-center">🎉 Sabhi staff present hain!</p>' :
                  absentStaff.map(u => `
                    <div class="bg-slate-950 p-2.5 rounded-xl flex items-center justify-between border border-slate-800 text-xs">
                      <div>
                        <div class="font-bold text-white">${u.name}</div>
                        <span class="text-[10px] text-slate-400">${u.role} • 📱 ${u.phone}</span>
                      </div>
                      <button onclick="markPresentUser('${u.id}')" class="text-[11px] bg-emerald-500/20 text-emerald-300 font-bold px-2.5 py-1 rounded-lg border border-emerald-500/40">
                        + Mark P
                      </button>
                    </div>
                  `).join('')
                }
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
              <h3 class="text-xs font-bold text-white">Staff Management (Edit / Delete)</h3>
              <div class="space-y-2">
                ${users.map(u => `
                  <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                    <div>
                      <h4 class="font-bold text-white">${u.name}</h4>
                      <p class="text-[11px] text-orange-300">${u.role}</p>
                      <span class="text-[10px] text-slate-500 font-mono">📱 ${u.phone}</span>
                    </div>
                    <div class="flex gap-2">
                      <button onclick="editUserPrompt('${u.id}')" class="bg-slate-800 text-slate-200 px-2.5 py-1 rounded-lg text-xs font-bold border border-slate-700">✏️ Edit</button>
                      ${!u.isOwner ? `<button onclick="deleteUser('${u.id}', '${u.name}')" class="bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded-lg text-xs font-bold">🗑️</button>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}
      `;

      document.getElementById('btnLogout').onclick = function() {
        saveSession(null);
        render();
      };

      const btnIn = document.getElementById('btnPunchIn');
      if (btnIn) {
        btnIn.onclick = function() {
          const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          currentUser.status = 'Present';
          currentUser.inTime = t;
          updateUserRecord(currentUser);
        };
      }

      const btnOut = document.getElementById('btnPunchOut');
      if (btnOut) {
        btnOut.onclick = function() {
          const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          currentUser.outTime = t;
          updateUserRecord(currentUser);
        };
      }
    }

    function updateUserRecord(user) {
      const users = getUsers().map(u => u.id === user.id ? user : u);
      saveUsers(users);
      saveSession(user);
      render();
    }

    function markPresentUser(id) {
      const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const users = getUsers().map(u => u.id === id ? { ...u, status: 'Present', inTime: t } : u);
      saveUsers(users);
      render();
    }

    function editUserPrompt(id) {
      const users = getUsers();
      const user = users.find(u => u.id === id);
      if (!user) return;
      const newName = prompt('Naya Naam likhein:', user.name);
      if (!newName) return;
      const newRole = prompt('Naya Role likhein:', user.role);
      if (!newRole) return;
      const newPhone = prompt('Naya Phone Number:', user.phone);
      if (!newPhone) return;

      user.name = newName.trim();
      user.role = newRole.trim();
      user.phone = newPhone.trim();
      saveUsers(users);
      const curr = getSession();
      if (curr && curr.id === id) saveSession(user);
      render();
    }

    function deleteUser(id, name) {
      if (confirm(`Kya aap "${name}" ko hatana chahte hain?`)) {
        saveUsers(getUsers().filter(u => u.id !== id));
        render();
      }
    }

    setInterval(() => {
      const clock = document.getElementById('clockDisplay');
      if (clock) clock.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }, 1000);

    render();
  </script>
</body>
</html>
